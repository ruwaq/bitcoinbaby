[package]
name = "genesis-babies"
version = "2.0.0"
edition = "2024"
description = "Genesis Sparks NFT Contract for BitcoinSparks on Charms v15"
authors = ["BitcoinSparks Team"]
license = "MIT"

[lib]
name = "genesis_babies"

[dependencies]
charms-sdk = { version = "15.0.0" }
serde = { version = "1.0", features = ["derive"] }
# sha2: required to close C3 — on-chain re-derivation of XP from a verified
# proof-of-work hash. Mirrors the babtc token contract's PoW primitives
# (`double_sha256` / `count_leading_zeros` / `verify_pow`). Same version as babtc.
sha2 = { version = "0.10.9" }

[dev-dependencies]
# Direct access to `Transaction`/`App`/`Data` for the integration tests in
# `tests/contract_integration.rs`. `charms_sdk::data` re-exports the same crate, but
# listing it as a dev-dep makes the test imports explicit and avoids reaching through the
# SDK facade.
charms-data = { version = "15.0.0" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
overflow-checks = true

# Empty [workspace] section to make this a "top-level" project
[workspace]
